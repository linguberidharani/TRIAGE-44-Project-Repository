
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRIAGE//44 — SOC Alert Classification Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/css/theme.css" />
  <link rel="stylesheet" href="src/css/layout.css" />
</head>
<body class="theme-dark">

  <a href="#app-root" class="skip-link">Skip to main content</a>

  <header class="app-header">
    <span class="logo">TRIAGE<span class="logo-accent">//44</span></span>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark or light theme">🌙</button>
  </header>

  <main id="app-root" tabindex="-1">

    <section id="loading-view" class="loading-view">
      <div class="spinner" aria-hidden="true"></div>
      <p class="loading-text">Loading scenarios…</p>
    </section>

    <section id="dashboard-view" class="dashboard-view hidden" tabindex="-1">
      <h1 class="dashboard-title">SOC Alert Classification Training</h1>
      <p class="dashboard-subtitle">Classify realistic SOC alerts as Malicious, Benign, or Needs Investigation.</p>

      <div class="stat-grid">
        <div class="stat-card">
          <span class="stat-label">Total Scenarios</span>
          <span class="stat-value" id="stat-total">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Correct Answers</span>
          <span class="stat-value" id="stat-correct">0</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Accuracy</span>
          <span class="stat-value" id="stat-accuracy">0%</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Progress</span>
          <span class="stat-value" id="stat-progress">0/0</span>
        </div>
      </div>

      <div class="filter-row">
        <label for="difficulty-filter" class="filter-label">Difficulty</label>
        <select id="difficulty-filter" class="filter-select">
          <option value="all">All Levels</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>

      <p id="empty-state-msg" class="empty-state-msg hidden" role="alert"></p>

      <button id="start-training-btn" class="start-button">Start Training</button>
      <button id="reset-btn" class="reset-button hidden">Reset Progress</button>
    </section>

    <section id="scenario-view" class="scenario-view hidden" tabindex="-1">
      <!-- Populated by app.js -->
    </section>

    <section id="end-screen-view" class="end-screen-view hidden" tabindex="-1">
      <!-- Populated by app.js -->
    </section>

  </main>

  <footer class="app-footer">
    <p>Built with Claude as part of the AB Talks 60-Day Claude AI Challenge.</p>
  </footer>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
